const KEY="narutoQuizAcademy_v7";
const defaults={xp:0,played:0,best:0,streak:0,lastVisit:null,history:[],current:null};
let memoryStore={};
function storage(){
  try{
    const t="__nqa_test__";
    window.localStorage.setItem(t,"1");
    window.localStorage.removeItem(t);
    return window.localStorage;
  }catch(e){
    try{return window.sessionStorage}catch(e2){return {getItem:k=>memoryStore[k]||null,setItem:(k,v)=>memoryStore[k]=String(v),removeItem:k=>delete memoryStore[k]}}
  }
}
const store=storage();
function loadData(){
  try{
    const raw=store.getItem(KEY);
    return raw?{...defaults,...JSON.parse(raw)}:{...defaults};
  }catch(e){return {...defaults}}
}
let data=loadData();
let view="home";
let mobileMenu=false;
let answering=false;
let currentTransition=null;
function save(){try{store.setItem(KEY,JSON.stringify(data))}catch(e){/* stockage local indisponible : la session continue en mémoire */}}
function todayKey(){const d=new Date();return d.toISOString().slice(0,10)}
function updateStreak(){const t=todayKey();if(data.lastVisit===t)return;if(data.lastVisit){const a=new Date(data.lastVisit),b=new Date(t);const days=Math.round((b-a)/86400000);data.streak=days===1?Math.max(1,data.streak+1):1}else data.streak=1;data.lastVisit=t;save()}
function rankFromXP(xp){if(xp>=8000)return"KAGE";if(xp>=5000)return"ANBU";if(xp>=3000)return"JŌNIN";if(xp>=1500)return"CHŪNIN";if(xp>=500)return"GENIN";return"ÉLÈVE"}
function nextRankXP(xp){const stops=[500,1500,3000,5000,8000];return stops.find(x=>xp<x)||8000}
function progress(){const r=rankFromXP(data.xp),next=nextRankXP(data.xp);if(r==="KAGE")return 100;const previous=r==="ÉLÈVE"?0:r==="GENIN"?500:r==="CHŪNIN"?1500:r==="JŌNIN"?3000:5000;return Math.max(0,Math.min(100,Math.round((data.xp-previous)/(next-previous)*100)))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function brand(){return `<div class="brand"><img class="seal" src="${IMG.naruto}" onerror="this.src='${FALLBACK}'" alt="Naruto"><div class="wordmark"><strong>NARUTO</strong><span>QUIZ / ACADEMY</span></div></div>`}
function nav(){return `<aside class="sidebar ${mobileMenu?"open":""}" id="sidebar"><div class="side-head">${brand()}<button class="close" onclick="toggleMenu(false)">×</button></div><div class="nav-label">Navigation</div><nav class="nav"><button class="${view==='home'?'active':''}" onclick="go('home')">⌂ &nbsp; Quartier général</button><button class="${view==='missions'||view==='quiz'||view==='result'?'active':''}" onclick="go('missions')">⚔ &nbsp; Missions</button><button class="${view==='characters'?'active':''}" onclick="go('characters')">♜ &nbsp; Personnages</button><button class="${view==='collection'?'active':''}" onclick="go('collection')">✦ &nbsp; Collection</button></nav><div class="nav-label">Votre dossier</div><div class="rank"><div class="rank-top"><span>Rang actuel</span><span>✦</span></div><b>${rankFromXP(data.xp)}</b><div class="track"><i style="width:${progress()}%"></i></div><small>${data.xp} XP</small></div><div class="side-bottom">Chaque réponse laisse une trace.<br>Progression sauvegardée sur cet appareil.</div></aside>`}
function top(){const label=view==='home'?'Quartier général':view==='missions'?'Missions':view==='characters'?'Personnages':view==='collection'?'Collection':view==='quiz'?'Mission active':'Rapport final';return `<header class="topbar"><button class="mobile-menu" onclick="toggleMenu()">☰</button><div class="crumb">Académie › <b>${label}</b></div><div class="actions-top"><button class="search-btn" onclick="openSearch()">⌕ &nbsp; Rechercher <span style="opacity:.5">Ctrl K</span></button><span class="streak">♨ ${data.streak} j</span><span class="avatar">IK</span></div></header>`}
function footer(){return `<footer class="footer"><span>© 2026 Naruto Quiz Academy</span><a href="https://ibrahdev.netlify.app" target="_blank" rel="noopener noreferrer">developed by ibrahdev</a></footer>`}
function home(){const r=rankFromXP(data.xp);return `<div class="main">${top()}<div class="content"><div class="intro"><div><span class="eyebrow">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span><h1>Bonjour, Shinobi.</h1></div><span class="session">● Session locale active</span></div><section class="hero"><img class="hero-bg" src="${IMG.naruto}" onerror="this.src='${FALLBACK}'" alt="Naruto Uzumaki"><div class="hero-copy"><span class="eyebrow">Dossier personnel · Academy</span><h2>La mémoire<br><em>est une arme.</em></h2><p>Teste tes connaissances, gagne de l'XP, monte en rang, découvre les personnages et construis ton dossier shinobi.</p><div class="btns"><button class="primary" onclick="start('basics')">Commencer une mission →</button><button class="secondary" onclick="go('missions')">Voir les missions</button></div></div><div class="hero-badge">特</div></section><div class="stats"><div class="stat"><small>Série actuelle</small><strong>${data.streak} JOURS</strong></div><div class="stat"><small>Meilleur score</small><strong>${data.best}%</strong></div><div class="stat"><small>Rang</small><strong>${r}</strong></div><div class="stat"><small>Missions terminées</small><strong>${data.played}</strong></div></div><section class="section"><div class="section-head"><div><span class="eyebrow">01 / Parcours</span><h3>Missions actives</h3></div><button class="secondary" onclick="go('missions')">Toutes les missions →</button></div><div class="mission-grid">${Object.keys(missions).map(missionCard).join('')}</div></section><section class="lower"><div class="card"><div class="section-head"><div><span class="eyebrow">02 / Progression</span><h3>Votre ascension</h3></div></div><div class="progress-row"><div class="level">${r}</div><div class="progress-copy"><strong>${data.xp} XP</strong><p>${r==='KAGE'?'Rang maximum atteint.':'Encore '+Math.max(0,nextRankXP(data.xp)-data.xp)+' XP pour le prochain rang.'}</p><div class="track"><i style="width:${progress()}%"></i></div></div></div></div><div class="card"><div class="section-head"><div><span class="eyebrow">03 / Archives</span><h3>Derniers exploits</h3></div><button class="secondary" onclick="go('collection')">Ouvrir →</button></div><div class="fragments">${data.history.length?data.history.slice(-3).reverse().map(x=>`<div class="fragment">✓<div><strong>${esc(x.title)}</strong><small>${x.score}% · +${x.xp} XP</small></div></div>`).join(''):`<div class="fragment">✦<div><strong>Aucune mission archivée</strong><small>Lance ta première mission.</small></div></div>`}</div></div></section></div>${footer()}</div>`}
function missionCard(id){const m=missions[id];return `<article class="mission"><img src="${m.image}" onerror="this.src='${FALLBACK}'" alt="${esc(m.title)}"><div class="mission-content"><span class="eyebrow">MISSION · ${id.toUpperCase()}</span><div><h4>${m.title}</h4><p>${m.desc}</p><div class="meta"><span>${m.questions.length} questions</span><span>${m.difficulty}</span></div><button class="primary" style="margin-top:18px" onclick="start('${id}')">Lancer →</button></div></div></article>`}
function missionsScreen(){return `<div class="main">${top()}<div class="screen"><div class="screen-inner"><span class="eyebrow">Académie / Dossiers</span><h2>Choisis ta piste.</h2><p class="lead">Chaque mission possède ses propres questions, sa difficulté et sa récompense. Après chaque réponse, tu passes automatiquement à la suivante.</p><div class="selection-grid">${Object.entries(missions).map(([id,m])=>`<button class="select-card" onclick="start('${id}')"><span class="chip">${m.difficulty}</span><h3>${m.title}</h3><p>${m.desc}</p><div class="meta">${m.questions.length} questions &nbsp; · &nbsp; lancer →</div></button>`).join('')}</div></div></div>${footer()}</div>`}
function charactersScreen(){return `<div class="main">${top()}<div class="screen"><div class="screen-inner"><span class="eyebrow">Archives / Personnages</span><h2>Shinobi index.</h2><p class="lead">Les personnages sont affichés avec des routes d'images distantes. Si une source ne répond pas, un fallback est automatiquement chargé.</p><div class="character-grid">${characters.map(c=>`<article class="character"><img src="${IMG[c.id]}" onerror="this.src='${FALLBACK}'" alt="${esc(c.name)}"><div class="character-body"><h3>${esc(c.name)}</h3><span class="chip">${esc(c.rank)}</span><p>${esc(c.desc)}</p></div></article>`).join('')}</div></div></div>${footer()}</div>`}
function collectionScreen(){return `<div class="main">${top()}<div class="screen"><div class="screen-inner"><span class="eyebrow">Archives / Progression</span><h2>Ta trace.</h2><p class="lead">Tes statistiques sont conservées localement sur cet appareil.</p><div class="card stats-card"><div class="section-head"><div><span class="eyebrow">Dossier personnel</span><h3>Statistiques</h3></div></div><div class="stat-grid"><div class="stat"><small>XP</small><strong>${data.xp}</strong></div><div class="stat"><small>Missions</small><strong>${data.played}</strong></div><div class="stat"><small>Meilleur</small><strong>${data.best}%</strong></div><div class="stat"><small>Rang</small><strong>${rankFromXP(data.xp)}</strong></div></div></div><div class="card" style="margin-top:15px"><div class="section-head"><div><span class="eyebrow">Historique</span><h3>Résultats</h3></div></div><div class="fragments">${data.history.length?data.history.slice().reverse().map(x=>`<div class="fragment">⚔<div><strong>${esc(x.title)}</strong><small>${x.score}% · +${x.xp} XP · ${new Date(x.date).toLocaleDateString('fr-FR')}</small></div><b>${x.score}%</b></div>`).join(''):`<div class="fragment">✦<div><strong>Pas encore de résultat</strong><small>Complète une mission pour remplir les archives.</small></div></div>`}</div></div></div></div>${footer()}</div>`}
function quiz(){const m=missions[data.current.mission],q=m.questions[data.current.index],pct=Math.round((data.current.index/m.questions.length)*100);return `<div class="quiz"><div class="quiz-head"><button onclick="quitQuiz()">← Quitter</button><span class="eyebrow">${m.title}</span><span class="qcount">${String(data.current.index+1).padStart(2,'0')} / ${String(m.questions.length).padStart(2,'0')}</span></div><div class="qtrack"><i style="width:${pct}%"></i></div><main class="quiz-main"><div class="question-meta"><span class="eyebrow">Question ${String(data.current.index+1).padStart(2,'0')}</span><span class="eyebrow" style="color:var(--muted)">${m.difficulty}</span></div><h1 class="question">${esc(q[0])}</h1><div class="answers">${q[1].map((a,i)=>`<button class="answer" data-answer="${i}" onclick="answer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(a)}</span></button>`).join('')}</div><div class="quiz-note">⚡ Clique sur une réponse : validation immédiate et passage automatique à la question suivante.</div></main></div>`}
function result(){const m=missions[data.current.mission],pct=Math.round(data.current.score/m.questions.length*100),r=pct>=90?'KAGE':pct>=75?'JŌNIN':pct>=50?'CHŪNIN':'GENIN';return `<div class="result"><span class="eyebrow">Mission terminée · ${m.title}</span><h2>Ta trace est laissée.</h2><div class="result-card"><div class="ring" style="--deg:${pct*3.6}deg"><div class="ring-inner"><div><strong>${pct}%</strong><small>PRÉCISION</small></div></div></div><div><span class="eyebrow">Rapport final</span><h3>Rang <em>${r}</em></h3><p class="result-desc">${pct>=75?'Lecture solide du terrain. Ton instinct shinobi est bien affûté.':'La piste est claire : quelques détails à revoir. Rejoue pour progresser.'}</p><div class="result-stats"><div><strong>${data.current.score}/${m.questions.length}</strong><span>réponses justes</span></div><div><strong>+${data.current.score*40}</strong><span>XP gagnés</span></div><div><strong>${r}</strong><span>rang de mission</span></div></div><div class="result-actions"><button class="primary" onclick="start('${data.current.mission}')">Rejouer</button><button class="secondary" onclick="go('missions')">Autres missions</button><button class="secondary" onclick="go('home')">Quartier général</button></div></div></div></div>`}
function render(){let body=view==='home'?home():view==='missions'?missionsScreen():view==='characters'?charactersScreen():view==='collection'?collectionScreen():view==='quiz'?quiz():result();document.getElementById('app').innerHTML=view==='quiz'||view==='result'?body:nav()+body;if(view==='quiz')setTimeout(()=>document.querySelector('.answer')?.focus(),0);window.scrollTo({top:0,behavior:'auto'})}
function go(v){view=v;mobileMenu=false;render()}
function toggleMenu(force){mobileMenu=force===undefined?!mobileMenu:force;document.getElementById('sidebar')?.classList.toggle('open',mobileMenu)}
function start(id){data.current={mission:id,index:0,score:0};save();view='quiz';answering=false;render()}
function quitQuiz(){if(confirm('Quitter cette mission ? Ta progression de cette tentative sera perdue.')){data.current=null;save();go('home')}}
function answer(i){if(answering||view!=='quiz'||!data.current)return;answering=true;const m=missions[data.current.mission],q=m.questions[data.current.index],buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);buttons[q[2]]?.classList.add('correct');if(i!==q[2])buttons[i]?.classList.add('wrong');const picked=buttons[i];picked?.classList.add('flash');if(i===q[2])data.current.score++;setTimeout(()=>{if(data.current.index<m.questions.length-1){data.current.index++;save();answering=false;render()}else{finish() }},380)}
function finish(){const m=missions[data.current.mission],score=data.current.score,pct=Math.round(score/m.questions.length*100),xp=score*40;data.xp+=xp;data.played++;data.best=Math.max(data.best,pct);data.history.push({title:m.title,score:pct,xp,date:new Date().toISOString()});data.history=data.history.slice(-30);save();view='result';answering=false;render()}
function openSearch(){document.getElementById('searchOverlay')?.remove();const o=document.createElement('div');o.className='overlay';o.id='searchOverlay';o.innerHTML='<div class="dialog"><input id="searchInput" autocomplete="off" placeholder="Chercher une mission ou un personnage…"><div class="search-results" id="searchResults"></div></div>';document.body.appendChild(o);const input=document.getElementById('searchInput');input.focus();input.oninput=()=>search(input.value);search('')}
function search(term){const box=document.getElementById('searchResults');if(!box)return;const q=term.toLowerCase().trim();const items=[...Object.entries(missions).map(([id,m])=>({type:'MISSION',name:m.title,run:()=>start(id)})),...characters.map(c=>({type:'PERSONNAGE',name:c.name,run:()=>go('characters')}))].filter(x=>!q||x.name.toLowerCase().includes(q)).slice(0,10);box.innerHTML=items.length?items.map((x,i)=>`<button onclick="searchPick(${i})">${x.type} · ${esc(x.name)}</button>`).join(''):'<div style="padding:12px;color:var(--muted);font-size:10px">Aucun résultat.</div>';window._searchItems=items}
function searchPick(i){const x=window._searchItems?.[i];document.getElementById('searchOverlay')?.remove();x?.run()}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')document.getElementById('searchOverlay')?.remove();if(view==='quiz'&&!answering&&['a','b','c','d'].includes(e.key.toLowerCase()))answer(e.key.toLowerCase().charCodeAt(0)-97)})
document.addEventListener('click',e=>{if(e.target.id==='searchOverlay')e.target.remove()})
updateStreak();render();
</script>
